<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Angel Wing</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

.wing {
    font-size: 180px;
    filter: drop-shadow(0 0 15px white);
    animation: float 3s ease-in-out infinite;
}

h2 {
    letter-spacing: 6px;
    font-weight: 300;
}

p {
    color: #aaa;
    letter-spacing: 3px;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-15px);
    }
}
</style>
</head>

<body>

<div class="wing">🪽</div>

<h2>ANGEL WING</h2>

<p>PURE • WHITE • DREAMY</p>

</body>
</html>
